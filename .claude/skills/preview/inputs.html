<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body class="ws" style="margin:0;padding:24px;background:#FAFAF7;font-family:var(--ws-font-sans)">
<style>
  .lbl{font-size:12px;font-weight:600;color:#2D2A26;margin-bottom:6px;display:block}
  .field{margin-bottom:14px}
  input,textarea{width:100%;padding:8px 12px;border-radius:8px;border:1px solid #E8E4DC;font-size:13px;outline:none;font-family:inherit;color:#2D2A26;box-sizing:border-box;background:#fff}
  input.focus{border-color:#C4725A}
  .quiet{width:100%;border:none;border-bottom:1px solid #F0EDE6;background:transparent;outline:none;font-size:14px;color:#2D2A26;padding:6px 0;font-family:inherit}
</style>
<div class="field"><label class="lbl">Name</label><input value="Health" /></div>
<div class="field"><label class="lbl">Description</label><input class="focus" placeholder="e.g. 6 months emergency fund" /></div>
<div class="field"><label class="lbl">Quiet (Today list)</label><input class="quiet" placeholder="add note…" /></div>
</body></html>
