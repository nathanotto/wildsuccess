<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body class="ws" style="margin:0;padding:24px;background:#FAFAF7;font-family:var(--ws-font-sans)">
<style>
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
  .b{background:#fff;border-radius:12px;padding:14px 16px}
  .lbl{font-size:10px;color:#8A8578;font-family:var(--ws-font-mono);margin-bottom:8px}
  .nm{font-size:12px;color:#2D2A26;font-weight:600}
</style>
<div class="grid">
  <div class="b" style="box-shadow:0 8px 32px rgba(45,42,38,0.12)"><div class="nm">Modal</div><div class="lbl">0 8px 32px rgba(45,42,38,.12)</div></div>
  <div class="b" style="box-shadow:0 4px 16px rgba(45,42,38,0.10)"><div class="nm">Menu / dropdown</div><div class="lbl">0 4px 16px rgba(45,42,38,.10)</div></div>
  <div class="b" style="box-shadow:0 2px 12px rgba(45,42,38,0.10)"><div class="nm">Capture (rest)</div><div class="lbl">0 2px 12px rgba(45,42,38,.10)</div></div>
  <div class="b" style="box-shadow:0 4px 24px rgba(196,114,90,0.18);border:1.5px solid #C4725A"><div class="nm">Capture (focus)</div><div class="lbl">0 4px 24px rgba(196,114,90,.18)</div></div>
  <div class="b" style="box-shadow:0 0 8px rgba(90,158,111,0.40);border:1px solid #5A9E6F;color:#2E7D32"><div class="nm">Success glow</div><div class="lbl">0 0 8px rgba(90,158,111,.40)</div></div>
  <div class="b" style="border:1px solid #E8E4DC"><div class="nm">No shadow (default card)</div><div class="lbl">— rest state —</div></div>
</div>
</body></html>
