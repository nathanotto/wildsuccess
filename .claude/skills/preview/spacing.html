<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body class="ws" style="margin:0;padding:20px;background:#FAFAF7;font-family:var(--ws-font-sans)">
<style>
  .row{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .bar{background:#C4725A;height:14px;border-radius:2px}
  .lbl{font-family:var(--ws-font-mono);font-size:10px;color:#8A8578;width:60px}
  .nm{font-size:11px;color:#2D2A26;font-weight:600}
</style>
<div class="row"><div class="lbl">4px</div><div class="bar" style="width:4px"></div><div class="nm">tight cluster</div></div>
<div class="row"><div class="lbl">6px</div><div class="bar" style="width:6px"></div><div class="nm">label → field, chip gap</div></div>
<div class="row"><div class="lbl">8px</div><div class="bar" style="width:8px"></div><div class="nm">item ↔ icon, button gap</div></div>
<div class="row"><div class="lbl">10px</div><div class="bar" style="width:10px"></div><div class="nm">brand → tabs</div></div>
<div class="row"><div class="lbl">12px</div><div class="bar" style="width:12px"></div><div class="nm">toast pad-y</div></div>
<div class="row"><div class="lbl">16px</div><div class="bar" style="width:16px"></div><div class="nm">field ↔ field in modal</div></div>
<div class="row"><div class="lbl">20px</div><div class="bar" style="width:20px"></div><div class="nm">section break, pad-x</div></div>
<div class="row"><div class="lbl">24px</div><div class="bar" style="width:24px"></div><div class="nm">capture lift, page-y</div></div>
<div class="row"><div class="lbl">32-36</div><div class="bar" style="width:32px"></div><div class="nm">modal interior</div></div>
</body></html>
