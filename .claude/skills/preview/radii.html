<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body class="ws" style="margin:0;padding:20px;background:#FAFAF7;font-family:var(--ws-font-sans)">
<style>
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .b{background:#fff;border:1px solid #E8E4DC;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
  .swatch{background:#C4725A20;border:1px solid #E8E4DC}
  .lbl{font-size:10px;color:#8A8578;font-family:var(--ws-font-mono)}
</style>
<div class="grid">
  <div class="b"><div class="swatch" style="width:80px;height:30px;border-radius:4px"></div><div class="lbl">4px · pill-sm</div></div>
  <div class="b"><div class="swatch" style="width:80px;height:30px;border-radius:5px"></div><div class="lbl">5px · tab</div></div>
  <div class="b"><div class="swatch" style="width:80px;height:30px;border-radius:8px"></div><div class="lbl">8px · button/input</div></div>
  <div class="b"><div class="swatch" style="width:80px;height:30px;border-radius:12px"></div><div class="lbl">12px · toast</div></div>
  <div class="b"><div class="swatch" style="width:80px;height:30px;border-radius:16px"></div><div class="lbl">16px · modal</div></div>
  <div class="b"><div class="swatch" style="width:80px;height:30px;border-radius:20px"></div><div class="lbl">20px · pill</div></div>
  <div class="b"><div class="swatch" style="width:80px;height:30px;border-radius:28px"></div><div class="lbl">28px · capture</div></div>
  <div class="b"><div class="swatch" style="width:30px;height:30px;border-radius:50%"></div><div class="lbl">50% · avatar</div></div>
</div>
</body></html>
