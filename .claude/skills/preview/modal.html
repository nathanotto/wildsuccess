<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body class="ws" style="margin:0;padding:0;background:rgba(45,42,38,0.25);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:var(--ws-font-sans);backdrop-filter:blur(2px)">
<div style="background:#fff;border-radius:16px;padding:24px 28px;width:90%;max-width:520px;border:1px solid #E8E4DC;box-shadow:0 8px 32px rgba(45,42,38,0.12)">
  <div style="font-size:16px;font-weight:700;color:#2D2A26;margin-bottom:14px">Edit Value</div>
  <div style="margin-bottom:12px">
    <label style="font-size:12px;font-weight:600;color:#2D2A26;display:block;margin-bottom:6px">Name</label>
    <input value="Financial sufficiency" style="width:100%;padding:8px 12px;border-radius:8px;border:1px solid #E8E4DC;font-size:13px;outline:none;font-family:inherit;box-sizing:border-box" />
  </div>
  <div style="margin-bottom:14px">
    <label style="font-size:12px;font-weight:600;color:#2D2A26;display:block;margin-bottom:6px">Type</label>
    <div style="display:flex;gap:14px;font-size:13px;color:#2D2A26">
      <label><input type="radio" checked style="accent-color:#C4725A"> Protect (Preventive)</label>
      <label><input type="radio" style="accent-color:#C4725A"> Expand (Promotional)</label>
    </div>
  </div>
  <div style="display:flex;gap:8px">
    <button style="background:#C4725A;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:13px;font-weight:600;cursor:pointer">Save</button>
    <button style="background:#F8F7F4;border:1px solid #E8E4DC;border-radius:8px;padding:10px 20px;font-size:13px;color:#2D2A26;cursor:pointer">Cancel</button>
  </div>
</div>
</body></html>
