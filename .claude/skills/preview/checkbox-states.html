<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body class="ws" style="margin:0;padding:24px;background:#FAFAF7;font-family:var(--ws-font-sans)">
<style>
  .row{display:flex;gap:24px;align-items:center;margin-bottom:8px}
  .lbl{font-size:11px;color:#8A8578;width:90px}
  .box{width:14px;height:14px;border:1.5px solid #B5B0A8;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex-shrink:0}
</style>
<div class="row"><div class="lbl">committed</div><span class="box"></span><span style="font-size:13px;color:#2D2A26">Drop off paperwork</span></div>
<div class="row"><div class="lbl">in_progress</div><span class="box" style="border-color:#C4725A"><span style="width:6px;height:6px;background:#C4725A;border-radius:1px"></span></span><span style="font-size:13px;color:#2D2A26">Drafting Q3 plan</span></div>
<div class="row"><div class="lbl">completed</div><span class="box" style="border-color:#8A857D;background:#8A857D;color:#fff;font-size:10px">✓</span><span style="font-size:14px;color:#8A857D;text-decoration:line-through">Morning walk</span></div>
<div class="row"><div class="lbl">parked</div><span class="box"><span style="position:absolute;bottom:0;left:0;right:0;height:7px;background:#B5B0A8"></span></span><span style="font-size:13px;color:#2D2A26">Tax review (pick up Mon)</span></div>
<div class="row"><div class="lbl">skipped</div><span class="box" style="color:#B5B0A8;font-size:10px;font-weight:700">✕</span><span style="font-size:14px;color:#B5B0A8">Coffee w/ Sam</span></div>
</body></html>
