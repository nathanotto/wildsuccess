<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body class="ws" style="margin:0;padding:24px;background:#FAFAF7;font-family:var(--ws-font-sans)">
<style>
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .lbl{font-size:10px;color:#8A8578;width:80px;font-family:var(--ws-font-mono)}
  button{font-family:inherit}
</style>
<div class="row">
  <div class="lbl">primary</div>
  <button style="background:#C4725A;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:13px;font-weight:600;cursor:pointer">Save</button>
  <button style="background:#C4725A;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:13px;font-weight:600;opacity:.5">Saving…</button>
</div>
<div class="row">
  <div class="lbl">secondary</div>
  <button style="background:#F8F7F4;border:1px solid #E8E4DC;border-radius:8px;padding:10px 20px;font-size:13px;color:#2D2A26;cursor:pointer">Cancel</button>
</div>
<div class="row">
  <div class="lbl">danger</div>
  <button style="background:#FDF5F4;border:1px solid #C4504A40;border-radius:8px;padding:10px 20px;font-size:13px;color:#C4504A;cursor:pointer">Delete</button>
</div>
<div class="row">
  <div class="lbl">tab idle</div>
  <button style="background:transparent;border:1px solid #F0EDE6;border-radius:5px;padding:3px 9px;font-size:10px;font-weight:600;color:#2D2A26">Today</button>
  <div class="lbl" style="margin-left:10px">tab active</div>
  <button style="background:#C4725A08;border:1px solid #C4725A40;border-radius:5px;padding:3px 9px;font-size:10px;font-weight:600;color:#C4725A">Map</button>
</div>
<div class="row">
  <div class="lbl">link</div>
  <a href="#" style="color:#C4725A;font-size:13px;font-weight:600;text-decoration:none">Request full access</a>
  <div class="lbl" style="margin-left:10px">action</div>
  <button style="background:none;border:none;font-size:12px;color:#8A8578;cursor:pointer;padding:0">→ It is done</button>
</div>
</body></html>
