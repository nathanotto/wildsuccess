<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body class="ws" style="margin:0;padding:20px;background:var(--ws-bg-page);">
<style>
  .row{display:flex;gap:10px;align-items:stretch}
  .sw{flex:1;border-radius:var(--ws-radius-md);border:1px solid var(--ws-border);overflow:hidden;background:#fff}
  .chip{height:64px}
  .meta{padding:8px 10px}
  .name{font-size:11px;font-weight:600;color:var(--ws-fg-1)}
  .hex{font-size:10px;color:var(--ws-fg-2);font-family:var(--ws-font-mono);margin-top:2px}
  .use{font-size:10px;color:var(--ws-fg-3);margin-top:2px}
</style>
<div class="row">
  <div class="sw"><div class="chip" style="background:#C4725A"></div><div class="meta"><div class="name">Primary</div><div class="hex">#C4725A</div><div class="use">brand, buttons, active</div></div></div>
  <div class="sw"><div class="chip" style="background:#C4725A40"></div><div class="meta"><div class="name">Primary 40%</div><div class="hex">#C4725A40</div><div class="use">focus border</div></div></div>
  <div class="sw"><div class="chip" style="background:#C4725A20"></div><div class="meta"><div class="name">Primary 20%</div><div class="hex">#C4725A20</div><div class="use">avatar bubble</div></div></div>
  <div class="sw"><div class="chip" style="background:#C4725A08"></div><div class="meta"><div class="name">Primary 3%</div><div class="hex">#C4725A08</div><div class="use">active tab bg</div></div></div>
  <div class="sw"><div class="chip" style="background:#4B82AF"></div><div class="meta"><div class="name">Secondary</div><div class="hex">#4B82AF</div><div class="use">calendar, confirm</div></div></div>
  <div class="sw"><div class="chip" style="background:#4B6A82"></div><div class="meta"><div class="name">Info</div><div class="hex">#4B6A82</div><div class="use">Today badge</div></div></div>
</div>
</body></html>
