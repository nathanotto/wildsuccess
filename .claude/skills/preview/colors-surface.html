<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body class="ws" style="margin:0;padding:20px;background:#FAFAF7;">
<style>
  .row{display:flex;gap:10px}
  .sw{flex:1;border-radius:var(--ws-radius-md);overflow:hidden;border:1px solid var(--ws-border)}
  .chip{height:64px}
  .meta{padding:8px 10px;background:#fff}
  .name{font-size:11px;font-weight:600;color:var(--ws-fg-1)}
  .hex{font-size:10px;color:var(--ws-fg-2);font-family:var(--ws-font-mono);margin-top:2px}
  .use{font-size:10px;color:var(--ws-fg-3);margin-top:2px}
</style>
<div class="row">
  <div class="sw"><div class="chip" style="background:#FAFAF7"></div><div class="meta"><div class="name">bg-page</div><div class="hex">#FAFAF7</div><div class="use">app background</div></div></div>
  <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="meta"><div class="name">bg-card</div><div class="hex">#FFFFFF</div><div class="use">cards, modals</div></div></div>
  <div class="sw"><div class="chip" style="background:#F8F7F4"></div><div class="meta"><div class="name">surface-1</div><div class="hex">#F8F7F4</div><div class="use">cancel, hover</div></div></div>
  <div class="sw"><div class="chip" style="background:#F0EDE6"></div><div class="meta"><div class="name">surface-2</div><div class="hex">#F0EDE6</div><div class="use">chips, dividers</div></div></div>
  <div class="sw"><div class="chip" style="background:#E8E4DC"></div><div class="meta"><div class="name">border</div><div class="hex">#E8E4DC</div><div class="use">inputs, modals</div></div></div>
</div>
</body></html>
