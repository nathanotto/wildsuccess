<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body class="ws" style="margin:0;background:#FAFAF7;font-family:var(--ws-font-sans)">
<div style="padding:8px 20px;display:flex;align-items:center;gap:5px;border-bottom:1px solid #F0EDE6;background:#fff">
  <div style="font-size:14px;font-weight:700;color:#C4725A;margin-right:10px">Wild Success</div>
  <button style="padding:3px 9px;border-radius:5px;border:1px solid #F0EDE6;font-size:10px;font-weight:600;color:#2D2A26;background:transparent">Map</button>
  <button style="padding:3px 9px;border-radius:5px;border:1px solid #C4725A40;font-size:10px;font-weight:600;color:#C4725A;background:#C4725A08;position:relative">Today<span style="position:absolute;top:-4px;right:-4px;min-width:14px;height:14px;border-radius:7px;background:#4B6A82;color:#fff;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px">7</span></button>
  <button style="padding:3px 9px;border-radius:5px;border:1px solid #F0EDE6;font-size:10px;font-weight:600;color:#2D2A26;background:transparent;position:relative">Organize<span style="position:absolute;top:-4px;right:-4px;min-width:14px;height:14px;border-radius:7px;background:#C4725A;color:#fff;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 3px">3</span></button>
  <button style="padding:3px 9px;border-radius:5px;border:1px solid #F0EDE6;font-size:10px;font-weight:600;color:#2D2A26;background:transparent">Plan</button>
  <button style="padding:3px 9px;border-radius:5px;border:1px solid #F0EDE6;font-size:10px;font-weight:600;color:#2D2A26;background:transparent">Communicate</button>
  <button style="padding:3px 9px;border-radius:5px;border:1px solid #F0EDE6;font-size:10px;font-weight:600;color:#2D2A26;background:transparent">Review</button>
  <button style="padding:3px 9px;border-radius:5px;border:1px solid #F0EDE6;font-size:10px;font-weight:600;color:#2D2A26;background:transparent">Spending</button>
  <span style="font-size:10px;color:#C4504A;font-weight:700;margin-left:4px">2 overdue</span>
  <div style="flex:1"></div>
  <button style="font-size:10px;color:#8A8578;background:none;border:none;margin-right:6px">Search</button>
  <button style="font-size:10px;color:#8A8578;background:none;border:none;margin-right:6px">Settings</button>
  <button style="font-size:10px;color:#8A8578;background:none;border:none;margin-right:6px">Log out</button>
  <div style="width:24px;height:24px;border-radius:50%;background:#C4725A20;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#C4725A">N</div>
</div>
