<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body class="ws" style="margin:0;padding:20px;background:#FAFAF7;">
<style>
  .row{display:flex;gap:10px}
  .card{flex:1;border-radius:var(--ws-radius-md);padding:12px 14px;border:1px solid}
  .ttl{font-size:11px;font-weight:700;margin-bottom:4px}
  .hex{font-size:10px;font-family:var(--ws-font-mono)}
  .body{font-size:10px;margin-top:6px}
</style>
<div class="row">
  <div class="card" style="background:#FDF5F4;border-color:#C4504A40;color:#C4504A">
    <div class="ttl">Danger</div>
    <div class="hex">#C4504A · bg #FDF5F4</div>
    <div class="body" style="color:#8A8578">Errors, delete actions</div>
  </div>
  <div class="card" style="background:#F4FDF7;border-color:#5A9E6F40;color:#4A8B5E">
    <div class="ttl">Success</div>
    <div class="hex">#5A9E6F · bg #F4FDF7</div>
    <div class="body" style="color:#8A8578">Saved, completed</div>
  </div>
  <div class="card" style="background:#FDF6F3;border-color:#C4725A40;color:#C4725A">
    <div class="ttl">Selected</div>
    <div class="hex">bg #FDF6F3</div>
    <div class="body" style="color:#8A8578">Active option, pickup</div>
  </div>
  <div class="card" style="background:#FFFFFF;border-color:#E8E4DC;color:#2D2A26">
    <div class="ttl">Neutral</div>
    <div class="hex">#FFFFFF · #E8E4DC</div>
    <div class="body" style="color:#8A8578">Default surface</div>
  </div>
</div>
</body></html>
