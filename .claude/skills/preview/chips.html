<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body class="ws" style="margin:0;padding:24px;background:#FAFAF7;font-family:var(--ws-font-sans)">
<style>
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
  .lbl{font-size:10px;color:#8A8578;width:80px;font-family:var(--ws-font-mono)}
  .chip{padding:2px 8px;border-radius:10px;background:#F8F7F4;border:1px solid #E8E4DC;color:#8A8578;font-size:10px}
  .pill{padding:6px 12px;border-radius:4px;border:1px solid #E8E4DC;background:#fff;color:#2D2A26;font-size:13px;cursor:pointer}
  .pill.on{border-color:#4B82AF;background:#4B82AF;color:#fff;font-weight:600}
  .seg{display:inline-flex;border:1px solid #E8E4DC;border-radius:8px;overflow:hidden;background:#fff}
  .seg button{border:none;background:transparent;padding:6px 12px;font-size:12px;color:#2D2A26;cursor:pointer;font-family:inherit}
  .seg button.on{background:#FDF6F3;color:#C4725A;font-weight:600}
</style>
<div class="row"><div class="lbl">linked</div><span class="chip">Health</span><span class="chip">Q3 Plan</span><span class="chip">Family</span></div>
<div class="row"><div class="lbl">time</div><button class="pill on">Now</button><button class="pill">9a</button><button class="pill">10a</button><button class="pill">2p</button></div>
<div class="row"><div class="lbl">segmented</div><div class="seg"><button class="on">Protect</button><button>Expand</button></div></div>
</body></html>
