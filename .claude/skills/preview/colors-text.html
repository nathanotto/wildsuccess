<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body class="ws" style="margin:0;padding:20px;background:var(--ws-bg-page);">
<style>
  .row{display:flex;gap:10px}
  .sw{flex:1;border-radius:var(--ws-radius-md);border:1px solid var(--ws-border);overflow:hidden;background:#fff}
  .chip{height:60px;display:flex;align-items:center;justify-content:center;font-family:var(--ws-font-sans);font-weight:700;font-size:14px}
  .meta{padding:8px 10px}
  .name{font-size:11px;font-weight:600;color:var(--ws-fg-1)}
  .hex{font-size:10px;color:var(--ws-fg-2);font-family:var(--ws-font-mono);margin-top:2px}
</style>
<div class="row">
  <div class="sw"><div class="chip" style="background:#FAFAF7;color:#2D2A26">Aa</div><div class="meta"><div class="name">fg-1 on bg-page</div><div class="hex">#2D2A26</div></div></div>
  <div class="sw"><div class="chip" style="background:#FAFAF7;color:#8A8578">Aa</div><div class="meta"><div class="name">fg-2 muted</div><div class="hex">#8A8578</div></div></div>
  <div class="sw"><div class="chip" style="background:#FAFAF7;color:#B5B0A8">Aa</div><div class="meta"><div class="name">fg-3 timestamp</div><div class="hex">#B5B0A8</div></div></div>
  <div class="sw"><div class="chip" style="background:#FAFAF7;color:#C4BFB4">Aa</div><div class="meta"><div class="name">fg-4 empty</div><div class="hex">#C4BFB4</div></div></div>
  <div class="sw"><div class="chip" style="background:#FAFAF7;color:#8A857D">Aa</div><div class="meta"><div class="name">fg warm-grey</div><div class="hex">#8A857D</div></div></div>
  <div class="sw"><div class="chip" style="background:#C4725A;color:#fff">Aa</div><div class="meta"><div class="name">on primary</div><div class="hex">#FFFFFF</div></div></div>
</div>
</body></html>
