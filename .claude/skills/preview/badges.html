<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"></head>
<body class="ws" style="margin:0;padding:24px;background:#FAFAF7;font-family:var(--ws-font-sans)">
<style>
  .row{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .pos{position:relative;padding:3px 9px;border:1px solid #F0EDE6;border-radius:5px;font-size:10px;font-weight:600;color:#2D2A26;background:transparent}
  .badge{position:absolute;top:-4px;right:-4px;min-width:14px;height:14px;border-radius:7px;color:#fff;font-size:8px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 3px}
  .lbl{font-size:11px;color:#8A8578;width:90px}
</style>
<div class="row"><div class="lbl">hopper</div><div class="pos">Organize<span class="badge" style="background:#C4725A">3</span></div></div>
<div class="row"><div class="lbl">today</div><div class="pos">Today<span class="badge" style="background:#4B6A82">7</span></div></div>
<div class="row"><div class="lbl">overdue</div><span style="font-size:10px;color:#C4504A;font-weight:700">2 overdue</span></div>
<div class="row"><div class="lbl">avatar</div><div style="width:24px;height:24px;border-radius:50%;background:#C4725A20;color:#C4725A;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700">N</div></div>
<div class="row"><div class="lbl">undo flash</div><div style="font-size:11px;font-weight:600;color:#2E7D32;padding:4px 10px;background:#fff;border:1px solid #5A9E6F;border-radius:6px;box-shadow:0 0 8px rgba(90,158,111,.4);display:inline-block">was: Drafting plan</div></div>
</body></html>
