<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Today — Current vs Proposed</title>
  <link rel="stylesheet" href="tokens.css" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; overflow: hidden; }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="data.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="today-current.jsx"></script>
  <script type="text/babel" src="today-proposed.jsx"></script>

  <script type="text/babel">
    const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="today-redesign"
            title="Today — current vs. proposed"
            subtitle="Same data, different treatment of contrast, aging, and end-of-day"
          >
            <DCArtboard id="current"  label="A · Current" width={1200} height={1100}>
              <window.TodayCurrent />
            </DCArtboard>
            <DCArtboard id="proposed" label="B · Proposed" width={1200} height={1100}>
              <window.TodayProposed />
            </DCArtboard>

            <DCPostIt top={-30} left={2540} rotate={-3} width={260}>
              <strong>Vision-board intent.</strong><br/>
              Full text, not truncated. Warm left rule, indented, regular weight (not italic).
              Calm, present — not a header to skim past.
            </DCPostIt>

            <DCPostIt top={330} left={2540} rotate={-2} width={260}>
              <strong>Next-up promoted.</strong><br/>
              Terracotta left rule + weight bump. The page's only “you might do this now”
              accent — earned because it's pure data (scheduled_time + nowTime).
            </DCPostIt>

            <DCPostIt top={510} left={2540} rotate={3} width={260}>
              <strong>Equal-weight columns.</strong><br/>
              Center divider gone. Scheduled and to-do are the <em>same pool</em>, stacked
              for column balance. Time-pinning is a property, not a tier.
            </DCPostIt>

            <DCPostIt top={690} left={2540} rotate={-2} width={260}>
              <strong>Bounded aging.</strong><br/>
              Captured-today = full weight. Older items step down once, then floor.
              “Schedule colonoscopy” on day 90 reads the same as on day 7. No shame curve.
            </DCPostIt>

            <DCPostIt top={870} left={2540} rotate={2} width={260}>
              <strong>In-progress glows.</strong><br/>
              Warm tint + 2px terracotta inset rule + weight-500 title. The eye lands
              here on every glance back at the page.
            </DCPostIt>

            <DCPostIt top={1050} left={2540} rotate={-3} width={260}>
              <strong>Stats line gone.</strong><br/>
              "4 done · 3 scheduled · 11 to-do" — precise without being useful.
              The columns themselves are the count.
            </DCPostIt>

            <DCPostIt top={1230} left={2540} rotate={2} width={260}>
              <strong>Close the day.</strong><br/>
              Quiet bottom-of-page affordance, always available. Tap = takes over the
              screen as a dedicated TOD close-out flow. Stub here; design next.
            </DCPostIt>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
